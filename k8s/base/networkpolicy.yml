apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: wayfinder
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tools-from-specialists
  namespace: wayfinder
spec:
  podSelector:
    matchLabels:
      role: tools
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: specialist
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: specialists-from-outside
  namespace: wayfinder
spec:
  podSelector:
    matchLabels:
      role: specialist
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["10.244.0.0/16"]
      ports:
        - port: 9001
        - port: 9002
        - port: 9003
