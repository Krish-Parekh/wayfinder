apiVersion: apps/v1
kind: Deployment
metadata:
  name: places-researcher
  namespace: wayfinder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: places-researcher
  template:
    metadata:
      labels:
        app: places-researcher
        role: specialist
    spec:
      enableServiceLinks: false
      containers:
        - name: places-researcher
          image: wayfinder
          command: ["python", "-m", "wayfinder.places_researcher"]
          envFrom:
            - configMapRef:
                name: wayfinder-config
          ports:
            - containerPort: 9002
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9002
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: places-researcher
  namespace: wayfinder
spec:
  selector:
    app: places-researcher
  ports:
    - port: 9002
      targetPort: 9002
