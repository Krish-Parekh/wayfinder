apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-scout
  namespace: wayfinder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-scout
  template:
    metadata:
      labels:
        app: food-scout
        role: specialist
    spec:
      enableServiceLinks: false
      containers:
        - name: food-scout
          image: wayfinder:dev
          imagePullPolicy: Never
          command: ["python", "-m", "wayfinder.food_scout"]
          envFrom:
            - configMapRef:
                name: wayfinder-config
            - secretRef:
                name: bedrock-creds
          ports:
            - containerPort: 9003
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9003
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: food-scout
  namespace: wayfinder
spec:
  type: NodePort
  selector:
    app: food-scout
  ports:
    - port: 9003
      targetPort: 9003
      nodePort: 30003
