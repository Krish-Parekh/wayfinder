<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfinder Architecture</title>
<style>
  :root {
    --paper:   #FBF8F1;
    --ink:     #1F2430;
    --muted:   #6B7280;
    --line:    #2D3440;
    --card:    #FFFFFF;
    --accent-in:   #C2410C;
    --accent-core: #1D4ED8;
    --accent-data: #047857;
    --accent-ext:  #7C3AED;
    --accent-stop: #BE123C;
  }
  :root[data-theme="dark"] {
    --paper:   #0D1117;
    --ink:     #E6EDF3;
    --muted:   #9198A1;
    --line:    #7D8590;
    --card:    #161B22;
    --accent-in:   #FB923C;
    --accent-core: #60A5FA;
    --accent-data: #34D399;
    --accent-ext:  #A78BFA;
    --accent-stop: #FB7185;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { padding: 40px; }
  .diagram { position: relative; background: var(--paper); margin: 0 0 56px; }
  .diagram svg.underlay {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }

  .node {
    position: absolute;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 7px; padding: 14px 12px; text-align: center;
  }
  .node .ico { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .node .ico svg { width: 100%; height: 100%; display: block; border-radius: 6px; }
  .node .title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
  .node .sub { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
  .node .sub code, .node .sub .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px; letter-spacing: -0.02em;
  }
  .node.chip { gap: 9px; padding: 0; }
  .node.chip .ico { width: 34px; height: 34px; }
  .node.chip .title { font-size: 12px; font-weight: 600; }
  .node.compact { gap: 5px; padding: 10px; }
  .node.compact .title { font-size: 14px; }

  .terminal {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }

  .elabel {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--paper);
    padding: 2px 7px;
    font-size: 11.5px; font-weight: 550; color: var(--muted);
    white-space: nowrap; border-radius: 4px;
  }
  .elabel.strong { color: var(--ink); font-weight: 650; }

  .glabel {
    position: absolute;
    font-size: 11px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--muted); background: var(--paper); padding: 0 8px;
  }

  .caption { position: absolute; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .caption b { color: var(--ink); font-weight: 650; }
  .caption code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 4px;
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="diagram" id="d-fleet"></div>
  <div class="diagram" id="d-memory"></div>
  <div class="diagram" id="d-eks"></div>
  <div class="diagram" id="d-stack"></div>
</div>


<script>
if (location.search.includes('dark')) document.documentElement.dataset.theme = 'dark';
// ?only=<id> renders one diagram at its exact size, for headless screenshots
const only = new URLSearchParams(location.search).get('only');
if (only) {
  document.querySelector('.sheet').style.padding = '0';
  for (const d of document.querySelectorAll('.diagram')) if (d.id !== only) d.style.display = 'none';
  else d.style.margin = '0';
}
</script>

/* ------------------------------------------------------------------ *
 *  Declarative diagram renderer.
 *  Nodes are absolutely-positioned HTML; rough.js draws the frames and
 *  connectors into an SVG underlay so both share one coordinate grid.
 * ------------------------------------------------------------------ */
function getVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const THEME = {
  in: getVar('--accent-in'), core: getVar('--accent-core'), data: getVar('--accent-data'),
  ext: getVar('--accent-ext'), stop: getVar('--accent-stop'),
  line: getVar('--line'), muted: getVar('--muted'), card: getVar('--card'),
};
const R = { roughness: 1.15, bowing: 1.1, strokeWidth: 2 };

function arrowHead(rc, svg, from, to, color) {
  const a = Math.atan2(to[1] - from[1], to[0] - from[0]);
  const len = 11, spread = 0.42;
  for (const s of [-spread, spread]) {
    svg.appendChild(rc.line(to[0], to[1],
      to[0] - len * Math.cos(a + s), to[1] - len * Math.sin(a + s),
      { ...R, roughness: 0.8, stroke: color, strokeWidth: 1.9 }));
  }
}

function render(mountId, spec) {
  const root = document.getElementById(mountId);
  root.style.width = spec.w + 'px';
  root.style.height = spec.h + 'px';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'underlay');
  svg.setAttribute('viewBox', `0 0 ${spec.w} ${spec.h}`);
  root.appendChild(svg);
  const rc = rough.svg(svg);

  for (const g of spec.groups || []) {
    svg.appendChild(rc.rectangle(g.x, g.y, g.w, g.h, {
      ...R, roughness: 1.5, stroke: g.color || THEME.muted,
      strokeWidth: 1.6, strokeLineDash: [9, 7], fill: 'none',
    }));
    if (g.label) {
      const el = document.createElement('div');
      el.className = 'glabel';
      el.textContent = g.label;
      el.style.left = (g.x + 18) + 'px';
      el.style.top = (g.y - 8) + 'px';
      root.appendChild(el);
    }
  }

  for (const e of spec.edges) {
    const color = e.color || THEME.line;
    const pts = e.points;
    const opts = {
      ...R, stroke: color, strokeWidth: 2, roughness: 1.05,
      ...(e.dashed ? { strokeLineDash: [7, 6] } : {}),
    };
    if (pts.length === 2) svg.appendChild(rc.line(pts[0][0], pts[0][1], pts[1][0], pts[1][1], opts));
    else svg.appendChild(rc.linearPath(pts, opts));
    arrowHead(rc, svg, pts[pts.length - 2], pts[pts.length - 1], color);

    if (e.label) {
      const el = document.createElement('div');
      el.className = 'elabel' + (e.strong ? ' strong' : '');
      el.textContent = e.label;
      el.style.left = e.lp[0] + 'px';
      el.style.top = e.lp[1] + 'px';
      root.appendChild(el);
    }
  }

  for (const n of spec.nodes) {
    const color = THEME[n.tone] || THEME.core;
    if (n.shape === 'circle') {
      svg.appendChild(rc.circle(n.x + n.w / 2, n.y + n.h / 2, Math.min(n.w, n.h), {
        ...R, stroke: color, fill: THEME.card, fillStyle: 'solid',
      }));
      const el = document.createElement('div');
      el.className = 'terminal';
      el.style.cssText += `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;color:${color}`;
      el.textContent = n.title || '';
      root.appendChild(el);
      continue;
    }

    if (n.shape === 'cylinder') {
      const lip = 13;
      svg.appendChild(rc.path(
        `M${n.x} ${n.y + lip} a ${n.w / 2} ${lip} 0 0 1 ${n.w} 0 l0 ${n.h - lip * 2} a ${n.w / 2} ${lip} 0 0 1 ${-n.w} 0 Z`,
        { ...R, stroke: color, fill: THEME.card, fillStyle: 'solid' }));
      svg.appendChild(rc.path(`M${n.x} ${n.y + lip} a ${n.w / 2} ${lip} 0 0 0 ${n.w} 0`,
        { ...R, stroke: color, strokeWidth: 1.5, roughness: 0.9 }));
    } else if (n.shape !== 'bare') {
      svg.appendChild(rc.rectangle(n.x, n.y, n.w, n.h, {
        ...R, stroke: color, fill: THEME.card, fillStyle: 'solid',
      }));
    }

    const el = document.createElement('div');
    el.className = 'node' + (n.compact ? ' compact' : '') + (n.chip ? ' chip' : '');
    el.style.cssText += `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;`;
    if (n.shape === 'cylinder') { el.style.paddingTop = '20px'; el.style.paddingBottom = '12px'; }
    el.innerHTML =
      (n.icon ? `<div class="ico">${ICONS[n.icon] || ''}</div>` : '') +
      (n.title ? `<div class="title">${n.title}</div>` : '') +
      (n.sub ? `<div class="sub">${n.sub}</div>` : '');
    const ic = el.querySelector('.ico');
    if (ic) ic.style.color = color;
    root.appendChild(el);
  }

  for (const c of spec.captions || []) {
    const el = document.createElement('div');
    el.className = 'caption';
    el.innerHTML = c.html;
    el.style.cssText += `left:${c.x}px;top:${c.y}px;width:${c.w}px;`;
    root.appendChild(el);
  }
}
